services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - payflow_net
    healthcheck:
      test: echo stat | nc localhost 2181
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - payflow_net
    healthcheck:
      test: nc -z localhost 9092
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - payflow_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: payflow_admin
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5433:5432"
    volumes:
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    networks:
      - payflow_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application Services
  bank-hdfc:
    build: .
    command: uvicorn services.bank_hdfc.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - payflow_net

  bank-sbi:
    build: .
    command: uvicorn services.bank_sbi.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - payflow_net

  gateway:
    build: .
    command: uvicorn services.gateway.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      bank-hdfc:
        condition: service_started
      bank-sbi:
        condition: service_started
    networks:
      - payflow_net

  ledger:
    build: .
    command: uvicorn services.ledger.main:app --host 0.0.0.0 --port 8003
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - payflow_net

  notifications:
    build: .
    command: python -m services.notifications.main
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - payflow_net

  payment-worker:
    build: .
    command: python -m services.payment_worker.main
    depends_on:
      kafka:
        condition: service_healthy
      bank-hdfc:
        condition: service_started
      bank-sbi:
        condition: service_started
    environment:
      KAFKA_BROKER_URL: kafka:9092
      HDFC_BANK_URL: http://bank-hdfc:8001
      SBI_BANK_URL: http://bank-sbi:8002
    networks:
      - payflow_net

  reconciliation-worker:
    build: .
    command: python -m services.reconciliation_worker.main
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://payflow_admin:secretpassword@postgres:5432/db_gateway
      LEDGER_URL: http://ledger:8003
      BATCH_SIZE: 50
      LOOKBACK_MINUTES: 120
      RECONCILIATION_INTERVAL_SECONDS: 10
    ports:
      - "8006:8006"
    networks:
      - payflow_net

  # Monitoring Infrastructure
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - gateway
    networks:
      - payflow_net

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - payflow_net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - payflow_net

networks:
  payflow_net:
    driver: bridge

volumes:
  pgdata: